:root{--b1:#084892;--b1-25:#063A75;--b2:#285AA5;--b5:#E5EEFF;--hl:#F7FAFF;--y1:#F8AF2C;--y3:#FFCA70;--y4:#FFE8C1;--y2-25:#9F6F00;--w1:#515151;--w2:#767676;--w4:#E5E5E5}
*{box-sizing:border-box}
@page{size:11in 8.5in;margin:0}
html,body{margin:0}
body{font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;background:var(--hl);color:var(--w1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cert{position:relative;width:1056px;height:816px;background:#fff;border-radius:25px;box-shadow:0 12px 32px rgba(8,72,146,.14);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* left band */
.band{position:absolute;left:0;top:0;bottom:0;width:256px;background:linear-gradient(165deg,var(--b1) 0%,var(--b1-25) 100%);overflow:hidden;color:#fff}
.band i{position:absolute;border-radius:50%;display:block}
.logo{position:absolute;left:34px;top:56px;width:188px;height:auto;overflow:visible}
.seal{position:absolute;left:50%;top:318px;width:150px;height:150px;margin-left:-75px}
.band .t{position:absolute;left:0;right:0;text-align:center}
.band .t1{top:492px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--y3)}
.band .t2{top:522px;font-size:15px;font-weight:500;line-height:1.5;padding:0 36px;color:#fff;opacity:.92}
.band .url{bottom:44px;font-size:13px;font-weight:600;letter-spacing:.04em}
